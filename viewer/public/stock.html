<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>銘柄詳細 | 05 ローカルビューア</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/chart.umd.js"></script>
</head>
<body>
<div class="topbar">
  <div class="logo">銘柄スカウター <small>05 ローカルビューア</small></div>
  <div class="nav"><a href="index.html">← 銘柄一覧へ</a></div>
</div>
<div class="wrap">
  <div class="stock-head" id="head"></div>

  <div class="panel">
    <h2>スコア</h2>
    <div class="body ind-grid" id="scoreGrid"></div>
  </div>

  <div class="panel" id="announcePanel" style="display:none">
    <h2>決算発表予定</h2>
    <div class="body" id="announceBody"></div>
  </div>

  <div class="panel">
    <h2>通期業績推移</h2>
    <div class="body">
      <h3 class="chart-title">売上高</h3>
      <div class="chart-box"><canvas id="salesChart"></canvas></div>
      <div class="chart-note">単位: 百万円</div>
      <h3 class="chart-title">利益（営業・経常・当期）</h3>
      <div class="chart-box"><canvas id="profitChart"></canvas></div>
      <div class="chart-note">単位: 百万円</div>
      <h3 class="chart-title">EPS・BPS</h3>
      <div class="chart-box"><canvas id="epsChart"></canvas></div>
      <div class="chart-note">単位: 円</div>
    </div>
  </div>

  <div class="panel">
    <h2>通期業績（数値）</h2>
    <div class="body">
      <div class="tbl-scroll" id="finTable"></div>
      <div id="flashAnnual"></div>
    </div>
  </div>

  <div class="panel" id="qtrPanel" style="display:none">
    <h2>四半期業績推移（3か月）</h2>
    <div class="body">
      <h3 class="chart-title">売上高（3か月）</h3>
      <div class="chart-box"><canvas id="qtrSalesChart"></canvas></div>
      <div class="chart-note">単位: 百万円</div>
      <h3 class="chart-title">利益（3か月・営業・経常・当期）</h3>
      <div class="chart-box"><canvas id="qtrProfitChart"></canvas></div>
      <div class="chart-note">単位: 百万円</div>
      <div class="tbl-scroll" id="qtrTable" style="margin-top:12px"></div>
      <div id="flashQ3"></div>
      <p class="muted" id="qtrNote"></p>
    </div>
  </div>

  <div class="panel" id="qtrCumPanel" style="display:none">
    <h2>四半期業績推移（累積）</h2>
    <div class="body">
      <h3 class="chart-title">売上高（累積）</h3>
      <div class="chart-box"><canvas id="qtrCumSalesChart"></canvas></div>
      <div class="chart-note">単位: 百万円</div>
      <h3 class="chart-title">利益（累積・営業・経常・当期）</h3>
      <div class="chart-box"><canvas id="qtrCumProfitChart"></canvas></div>
      <div class="chart-note">単位: 百万円</div>
      <div class="tbl-scroll" id="qtrCumTable" style="margin-top:12px"></div>
      <div id="flashQcum"></div>
      <p class="muted" id="qtrCumNote"></p>
    </div>
  </div>

  <div class="panel">
    <h2>キャッシュフロー推移</h2>
    <div class="body">
      <div class="chart-box"><canvas id="cfChart"></canvas></div>
      <div class="chart-note">単位: 百万円</div>
    </div>
  </div>

  <div class="panel">
    <h2>キャッシュフロー（数値）</h2>
    <div class="body tbl-scroll" id="cfTable"></div>
  </div>

  <div class="panel">
    <h2>指標一覧</h2>
    <div class="body ind-grid" id="indGrid"></div>
  </div>
</div>
<script src="stock.js"></script>
</body>
</html>
