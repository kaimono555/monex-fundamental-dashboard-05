<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業績データ貼付 → 実行 | 05 ローカルビューア</title>
<link rel="stylesheet" href="style.css">
<style>
  textarea {
    width: 100%; min-height: 200px; font: 12px/1.6 Consolas, monospace;
    border: 1px solid var(--border); border-radius: 4px; padding: 10px;
    resize: vertical;
  }
  .paste-block { margin-bottom: 14px; }
  .paste-block-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
  }
  .paste-block-label { font-size: 12px; color: var(--ink-2); font-weight: bold; }
  .remove-block-btn {
    font: inherit; font-size: 11px; padding: 2px 10px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 4px; background: #fff; color: var(--ink-2);
  }
  .add-block-btn {
    font: inherit; width: 100%; padding: 8px; cursor: pointer;
    border: 1px dashed var(--border); border-radius: 4px; background: #fff; color: #1a5fb4;
  }
  .actions { margin-top: 12px; display: flex; align-items: center; gap: 12px; }
  .actions button {
    font: inherit; font-weight: bold; padding: 8px 28px; cursor: pointer;
    background: var(--brand-dark); color: #fff; border: none; border-radius: 4px;
  }
  .actions button:disabled { opacity: .5; cursor: default; }
  #status.ok { color: var(--up); }
  #status.err { color: var(--down); }
  .result-row { border-bottom: 1px solid #e4e4de; padding: 8px 4px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .result-row .code { font-weight: bold; }
  .result-row .ok { color: var(--up); }
  .result-row .err { color: var(--down); }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">銘柄スカウター <small>05 ローカルビューア</small></div>
  <div class="nav"><a href="index.html">← 銘柄一覧へ</a></div>
</div>
<div class="wrap">
  <div class="panel">
    <h2>業績データ貼付 → 実行</h2>
    <div class="body">
      <p class="muted" style="font-size:12px">
        マネックス銘柄スカウターの銘柄ページのテキストを貼り付けて「実行」を押すと、
        銘柄コード・銘柄名を自動判別して <code>data/output/{コード}_financials.csv</code> に保存します
        （キャッシュフロー推移が含まれていればCFも保存）。
        既存データは<b>決算期単位でマージ</b>（同じ決算期は上書き・他の期は保持）。「予」の付く会社予想行は取り込みません。<br>
        複数銘柄をまとめて処理する場合は「＋ 銘柄を追加」で貼付欄を増やしてください。1件ずつ順番に処理されます。
      </p>
      <div id="pasteBlocks"></div>
      <button id="addBlockBtn" class="add-block-btn" type="button">＋ 銘柄を追加</button>
      <div class="actions">
        <button id="runBtn" type="button">実行</button>
        <span id="status"></span>
      </div>
    </div>
  </div>
  <div class="panel" id="resultPanel" style="display:none">
    <h2>処理結果</h2>
    <div class="body" id="resultList"></div>
  </div>
</div>
<script>
let blockCount = 0;
const statusEl = document.getElementById("status");
function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }

function addBlock() {
  blockCount += 1;
  const wrap = document.createElement("div");
  wrap.className = "paste-block";
  wrap.innerHTML =
    '<div class="paste-block-head">' +
      '<span class="paste-block-label">銘柄 ' + blockCount + '</span>' +
      '<button type="button" class="remove-block-btn">削除</button>' +
    '</div>' +
    '<textarea placeholder="ここにマネックス銘柄スカウターの銘柄ページのテキストを貼り付けてください（銘柄コードは自動判別）"></textarea>';
  wrap.querySelector(".remove-block-btn").addEventListener("click", () => {
    if (document.querySelectorAll(".paste-block").length <= 1) {
      setStatus("最低1つは貼付欄が必要です。", "err");
      return;
    }
    wrap.remove();
    renumber();
  });
  document.getElementById("pasteBlocks").appendChild(wrap);
}
function renumber() {
  document.querySelectorAll(".paste-block").forEach((b, i) => {
    b.querySelector(".paste-block-label").textContent = "銘柄 " + (i + 1);
  });
}
document.getElementById("addBlockBtn").addEventListener("click", addBlock);
addBlock();

const runBtn = document.getElementById("runBtn");
runBtn.addEventListener("click", async () => {
  if (runBtn.disabled) return;
  const texts = Array.from(document.querySelectorAll(".paste-block textarea"))
    .map(ta => ta.value).filter(t => t.trim().length > 0);
  if (!texts.length) {
    setStatus("テキストが空です。銘柄ページのテキストを貼り付けてから実行してください。", "err");
    return;
  }
  runBtn.disabled = true;
  const resultPanel = document.getElementById("resultPanel");
  const resultList = document.getElementById("resultList");
  resultPanel.style.display = "";
  resultList.innerHTML = "";
  let ok = 0, ng = 0;
  try {
    for (let i = 0; i < texts.length; i++) {
      setStatus(`処理中... (${i + 1}/${texts.length})`, "");
      const row = document.createElement("div");
      row.className = "result-row";
      try {
        const res = await fetch("/api/manual", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: texts[i] }),
        });
        const d = await res.json();
        if (!res.ok) {
          ng++;
          row.innerHTML = `<span class="code">銘柄 ${i + 1}</span><span class="err">${d.error || "エラー"}</span>`;
        } else {
          ok++;
          const cfNote = d.cf ? ` ／ CF: 追加 ${d.cf.added} 期・上書き ${d.cf.updated} 期` : "";
          row.innerHTML =
            `<span class="code">${d.code}</span><span>${d.name || ""}</span>` +
            `<span class="ok">保存OK（業績: 追加 ${d.fin.added} 期・上書き ${d.fin.updated} 期・合計 ${d.fin.total} 期${cfNote}）</span>` +
            `<a href="stock.html?code=${encodeURIComponent(d.code)}" target="_blank">詳細ページを開く</a>`;
        }
      } catch (e) {
        ng++;
        row.innerHTML = `<span class="code">銘柄 ${i + 1}</span><span class="err">通信エラー: ${e}</span>`;
      }
      resultList.appendChild(row);
    }
    setStatus(`完了: 成功 ${ok} 件 / 失敗 ${ng} 件`, ng ? "err" : "ok");
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
